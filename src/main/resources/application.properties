spring.application.name=devpulse
server.port=8080

# --- Database (H2 in-memory for Phase 2; PostgreSQL arrives in Phase 3) ---
spring.datasource.url=jdbc:h2:mem:devpulse;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# --- DevPulse engine (bound to config/DevPulseProperties) ---
devpulse.engine.queue-capacity=1000
devpulse.engine.worker-threads=4
devpulse.engine.error-threshold=5
devpulse.engine.error-window=5s

# console | file   (decides which Notifier bean exists)
devpulse.notifications.type=console
devpulse.notifications.file-path=devpulse-notifications.log

# true = register demo projects and run fake apps for 20s after startup
devpulse.seed-demo-data=true
